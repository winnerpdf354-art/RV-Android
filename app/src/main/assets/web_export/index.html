<!DOCTYPE html>
<html lang="hi" data-theme="dark" data-bg="1" data-card="1">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030712">
<title>Revision Universe</title>
<style>
:root {
  --bg: #030712;
  --surface: #0C1222;
  --surface2: #131B2E;
  --study-bg: #090D16;
  --study-card: #111827;
  --text: #F8FAFC;
  --muted: #94A3B8;
  --border: rgba(148,163,184,0.18);
  --subtle: rgba(255,255,255,0.06);
  --card-fill: rgba(17,25,43,0.82);
  --blue: #38BDF8;
  --emerald: #34D399;
  --amber: #FBBF24;
  --purple: #A78BFA;
  --red: #FB7185;
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
html[data-theme="light"] {
  --bg: #F4F7FB;
  --surface: #FFFFFF;
  --surface2: #EAF0F8;
  --study-bg: #F6F8FC;
  --study-card: #FFFFFF;
  --text: #0F172A;
  --muted: #475569;
  --border: rgba(15,23,42,0.14);
  --subtle: rgba(15,23,42,0.05);
  --card-fill: rgba(255,255,255,0.92);
  --blue: #0284C7;
  --emerald: #059669;
  --amber: #B45309;
  --purple: #7C3AED;
  --red: #E11D48;
}
html[data-card="2"] { --card-fill: rgba(18,27,46,0.62); }
html[data-theme="light"][data-card="2"] { --card-fill: rgba(255,255,255,0.78); }
html[data-card="3"] { --card-fill: rgba(17,27,48,0.32); }
html[data-theme="light"][data-card="3"] { --card-fill: rgba(255,255,255,0.54); }
html[data-card="4"] { --card-fill: #0E1525; }
html[data-theme="light"][data-card="4"] { --card-fill: #FFFFFF; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; min-height: 100%;
  background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: 14px; line-height: 1.45;
  overscroll-behavior-y: none;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
}
html[data-bg="1"] body::before {
  background:
    radial-gradient(circle at 15% 8%, rgba(56,189,248,0.18), transparent 45%),
    radial-gradient(circle at 90% 65%, rgba(52,211,153,0.14), transparent 42%);
}
html[data-bg="2"] body::before {
  background-image: radial-gradient(rgba(148,163,184,0.12) 1px, transparent 1px);
  background-size: 24px 24px;
}
html[data-bg="3"] body::before { background: none; }
html[data-bg="4"] body::before {
  background-image: radial-gradient(rgba(148,163,184,0.22) 1.5px, transparent 1.5px);
  background-size: 28px 28px;
}
html[data-bg="5"] body::before {
  background:
    radial-gradient(circle at 82% 14%, rgba(56,189,248,0.25), transparent 40%),
    radial-gradient(circle at 18% 52%, rgba(167,139,250,0.22), transparent 44%),
    radial-gradient(circle at 70% 88%, rgba(251,191,36,0.16), transparent 38%);
}

.app { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
button, input, textarea, select { font-family: inherit; color: inherit; }
button { cursor: pointer; border: none; background: transparent; }

/* Header & Tabs */
.topbar {
  position: sticky; top: 0; z-index: 30;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  padding-top: env(safe-area-inset-top, 0px);
}
.topbar-row { display: flex; align-items: center; gap: 6px; padding: 10px 10px 6px; }
.icon-btn {
  width: 42px; height: 42px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--text); position: relative; flex-shrink: 0;
}
.icon-btn:active { background: var(--subtle); }
.topbar-title { flex: 1; font-size: 19px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge-dot {
  position: absolute; top: 4px; right: 4px; min-width: 17px; height: 17px;
  border-radius: 99px; background: var(--blue); color: #fff;
  font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 4px;
}
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); }
.tab-btn {
  padding: 11px 6px; font-weight: 600; font-size: 13.5px; color: var(--muted);
  border-bottom: 3px solid transparent; transition: color .15s, border-color .15s;
}
.tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 700; }

/* Content & Cards */
.page { flex: 1; padding: 14px 14px 100px; display: flex; flex-direction: column; gap: 12px; }
.card {
  background: var(--card-fill);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 15px;
  backdrop-filter: blur(10px);
}
.row { display: flex; align-items: center; gap: 8px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.col { display: flex; flex-direction: column; gap: 6px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }
.lbl-sm { font-size: 10.5px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--muted); }
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: 99px; font-size: 11.5px; font-weight: 600;
  background: var(--subtle); border: 1px solid var(--border);
}
.pill.active { background: color-mix(in srgb, var(--blue) 20%, transparent); border-color: var(--blue); color: var(--blue); }
.bar-track { width: 100%; height: 6px; border-radius: 99px; background: var(--subtle); overflow: hidden; display: flex; }
.bar-fill { height: 100%; border-radius: 99px; transition: width .25s; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 16px; border-radius: 14px; font-weight: 600; font-size: 14px;
  background: var(--blue); color: #fff; min-height: 46px;
}
.btn.emerald { background: var(--emerald); }
.btn.red { background: var(--red); }
.btn.outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn.full { width: 100%; }
.input {
  width: 100%; padding: 10px 13px; border-radius: 12px;
  background: var(--subtle); border: 1px solid var(--border);
  font-size: 14px; outline: none;
}
.input:focus { border-color: var(--blue); }

/* Habit Strip */
.habit-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 8px; }
.habit-cell { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 4px 0; border-radius: 12px; }
.habit-box {
  width: 38px; height: 38px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  background: var(--subtle); border: 1px solid var(--border);
  font-family: var(--mono); font-size: 12px; font-weight: 700;
}
.habit-box.active { background: color-mix(in srgb, var(--emerald) 22%, transparent); border-color: var(--emerald); color: var(--emerald); }
.habit-box.today { border-width: 1.5px; border-color: var(--emerald); }
.habit-box.selected { border-width: 1.5px; border-color: var(--blue); box-shadow: 0 0 0 2px color-mix(in srgb, var(--blue) 28%, transparent); }

/* History / Syllabus Items */
.sub-stripe { width: 4px; align-self: stretch; min-height: 36px; border-radius: 99px; flex-shrink: 0; }
.note-box {
  margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 8px;
}
.note-card {
  background: var(--subtle); border-radius: 12px; padding: 10px 12px;
  border: 1px solid var(--border);
}
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 14px; background: var(--card-fill); }
table { width: 100%; border-collapse: collapse; min-width: 560px; font-size: 12.5px; }
th, td { padding: 10px 10px; text-align: left; border-bottom: 1px solid var(--border); }
th { font-size: 11px; color: var(--muted); background: var(--subtle); }

/* FAB */
.fab {
  position: fixed; right: 18px; bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  z-index: 40; height: 56px; min-width: 56px; border-radius: 99px;
  background: var(--blue); color: #fff; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 0 18px; box-shadow: 0 10px 26px rgba(0,0,0,0.36);
  border: 1px solid rgba(255,255,255,0.22);
}
.fab.square { padding: 0; width: 56px; font-size: 26px; }
.fab.live { background: var(--emerald); }
.fab.paused { background: var(--amber); }

/* Drawer & Overlays */
.backdrop {
  position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,0.55);
  display: none;
}
.backdrop.open { display: block; }
.sidebar {
  position: fixed; top: 0; left: 0; bottom: 0; width: min(315px, 86vw); z-index: 70;
  background: var(--surface); border-right: 1px solid var(--border);
  transform: translateX(-105%); transition: transform .22s ease;
  overflow-y: auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 32px;
  display: flex; flex-direction: column; gap: 12px;
}
.sidebar.open { transform: translateX(0); }
.right-drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(350px, 88vw); z-index: 75;
  background: var(--surface); border-left: 1px solid var(--border);
  border-radius: 22px 0 0 22px;
  transform: translateX(105%); transition: transform .22s ease;
  display: flex; flex-direction: column;
}
.right-drawer.open { transform: translateX(0); }

.overlay-screen {
  position: fixed; inset: 0; z-index: 80;
  background: var(--bg); display: none; flex-direction: column;
  max-width: 680px; margin: 0 auto;
}
.overlay-screen.open { display: flex; }
.overlay-screen.study { background: var(--study-bg); }
.overlay-body { flex: 1; overflow-y: auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 13px; }
.sticky-dock {
  background: var(--study-card); border-top: 1px solid var(--border);
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}

/* Modal / Bottom Sheet */
.sheet-wrap {
  position: fixed; inset: 0; z-index: 95; background: rgba(0,0,0,0.58);
  display: none; align-items: flex-end; justify-content: center;
}
.sheet-wrap.open { display: flex; }
.sheet {
  width: 100%; max-width: 640px; max-height: 88vh;
  background: var(--surface); border-radius: 24px 24px 0 0;
  border-top: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.sheet-head { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.sheet-body { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.sheet-foot { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; gap: 10px; }

/* Thread Selector & Chronograph */
.thread-step { display: flex; align-items: flex-start; gap: 10px; padding: 4px; cursor: pointer; }
.thread-node {
  width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0;
}
.thread-node.done { background: var(--emerald); border-color: var(--emerald); color: #fff; }
.thread-line { width: 2px; height: 22px; background: var(--border); margin: 2px auto; }
.thread-line.done { background: var(--emerald); }
.chrono-ticks { display: grid; grid-template-columns: repeat(60, 1fr); gap: 1.5px; height: 32px; align-items: end; }
.chrono-tick { background: rgba(148,163,184,0.28); border-radius: 2px; }
.chrono-tick.lit { background: var(--emerald); }
.chrono-tick.lit.paused { background: var(--amber); }

/* Island Toast */
.toast {
  position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%;
  transform: translate(-50%, -140%); transition: transform .22s ease;
  z-index: 120; background: #101828; color: #fff;
  border: 1px solid rgba(56,189,248,0.45); border-radius: 99px;
  padding: 9px 15px; display: flex; align-items: center; gap: 10px;
  box-shadow: 0 10px 28px rgba(0,0,0,0.42); max-width: 92vw;
  font-size: 13px; font-weight: 600;
}
.toast.show { transform: translate(-50%, 0); }
.toast-undo {
  background: rgba(56,189,248,0.22); color: var(--blue);
  padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: 700;
}
.empty { text-align: center; padding: 46px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.fmt-bar { display: flex; gap: 4px; overflow-x: auto; padding: 8px 10px; border-top: 1px solid var(--border); background: var(--surface); }
.fmt-btn { padding: 7px 10px; border-radius: 8px; background: var(--subtle); font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.divider { height: 1px; background: var(--border); width: 100%; }
</style>
</head>

<aside class="right-drawer" id="syllabusDrawer"></aside>

<section class="overlay-screen" id="toolsOverlay"></section>

</div>

const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid = () => 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
function subCol(name) {
  let h = 0, t = String(name || '').trim();
  for (let i = 0; i < t.length; i++) h = ((h * 31) + t.charCodeAt(i)) >>> 0;
  return SUB_PAL[h % SUB_PAL.length];
}
function todayIso() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function daysAgoIso(n) {
  const d = new Date(); d.setDate(d.getDate() - n);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function fmtMin(m) {
  m = Math.max(0, Math.round(m || 0));
  const h = Math.floor(m / 60), r = m % 60;
  if (h > 0 && r > 0) return `${h}h ${r}m`;
  if (h > 0) return `${h}h`;
  return `${r}m`;
}
function fmtClock(sec) {
  sec = Math.max(0, Math.floor(sec || 0));
  return String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
}
function fmtDate(iso) {
  if (!iso) return '—';
  if (iso === todayIso()) return 'Today';
  if (iso === daysAgoIso(1)) return 'Yesterday';
  const d = new Date(iso + 'T00:00:00');
  return isNaN(d) ? iso : d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}
function statusMeta(key) {
  if (key === 'Easy') return { label: 'Clear', hi: 'पक्का', col: 'var(--emerald)', prio: 1 };
  if (key === 'Hard') return { label: 'Relearn', hi: 'दोहराना', col: 'var(--red)', prio: 3 };
  return { label: 'Practice', hi: 'अभ्यास', col: 'var(--amber)', prio: 2 };
}
function lecNum(s) {
  const m = String(s || '').match(/\d+/);

}
function extractUrls(text) {
  return (String(text || '').match(/https?:\/\/[^\s\]\)>"']+/g) || []).map(u => u.replace(/[.,;]+$/, ''));
}
function urlCategory(url) {

let toastTimer = null, undoCallback = null;
function showToast(msg, undoLabel, onUndo) {
  clearTimeout(toastTimer);
  undoCallback = onUndo || null;
  const el = document.getElementById('islandToast');
  el.innerHTML = `<span>${esc(msg)}</span>` + (undoLabel && onUndo ? `<button class="toast-undo" onclick="runToastUndo()">${esc(undoLabel)}</button>` : '');
  el.classList.add('show');
  toastTimer = setTimeout(() => el.classList.remove('show'), onUndo ? 4800 : 2800);
}
function runToastUndo() {
  if (undoCallback) { const fn = undoCallback; undoCallback = null; fn(); }
  document.getElementById('islandToast').classList.remove('show');
}

function getFilteredHistory(f = UI.historyFilter, q = UI.historySearch) {
  const lq = q.trim().toLowerCase();
  let list = DB.sessions.filter(s => {
    if (lq) {
      const hay = `${s.subject} ${s.chapter} ${s.lecture} ${s.plainNotes || ''} ${s.date} ${statusMeta(s.status).label}`.toLowerCase();
      if (!hay.includes(lq)) return false;
    }
    if (f.timeMode === 'month' && f.months.length) {
      const m = new Date(s.date + 'T00:00:00').getMonth();
      if (!f.months.includes(m)) return false;
    }
    if (f.timeMode === 'year' && f.years.length) {
      const y = new Date(s.date + 'T00:00:00').getFullYear();
      if (!f.years.includes(y)) return false;
    }
    if (f.timeMode === 'range') {
      if (f.from && s.date < f.from) return false;
      if (f.to && s.date > f.to) return false;
    }
    if (f.timeMode === 'exact' && f.exact && s.date !== f.exact) return false;
    if (f.timeMode === 'past') {
      if (f.pastExactAgo) { if (s.date !== daysAgoIso(f.pastDays)) return false; }
      else { if (s.date < daysAgoIso(f.pastDays - 1) || s.date > todayIso()) return false; }
    }
    if (f.subjects.length && !f.subjects.includes(s.subject)) return false;
    if (f.modes.length && !f.modes.includes(s.mode)) return false;
    if (f.statuses.length && !f.statuses.includes(s.status)) return false;
    return true;
  });
  const cmp = {
    newest: (a, b) => (b.date.localeCompare(a.date) || (b.timestamp - a.timestamp)),
    oldest: (a, b) => (a.date.localeCompare(b.date) || (a.timestamp - b.timestamp)),
    most_time: (a, b) => b.durationMinutes - a.durationMinutes,
    least_time: (a, b) => a.durationMinutes - b.durationMinutes,
    subject: (a, b) => a.subject.localeCompare(b.subject),
    hard: (a, b) => statusMeta(b.status).prio - statusMeta(a.status).prio
  }[f.sort] || ((a, b) => b.timestamp - a.timestamp);
  return list.sort(cmp);
}
function activeFilterCount(f = UI.historyFilter) {
  let c = 0;
  if (f.sort !== 'newest') c++;
  if (f.timeMode !== 'none') c++;
  if (f.subjects.length) c++;
  if (f.modes.length) c++;
  if (f.statuses.length) c++;
  return c;
}

// ================= ANALYTICS TAB =================
function buildAnalyticsHtml() {
  const today = todayIso();
  const todaySess = DB.sessions.filter(s => s.date === today);
  const todayMin = todaySess.reduce((a, b) => a + (b.durationMinutes || 0), 0);
  const todaySubs = new Set(todaySess.map(s => s.subject)).size;
  const todayChaps = new Set(todaySess.map(s => s.subject + '::' + s.chapter)).size;
  const goal = DB.prefs.dailyGoalMinutes || 0;
  const pct = goal > 0 ? Math.min(999, Math.round((todayMin / goal) * 100)) : 0;
  const barCol = pct >= 100 ? 'var(--emerald)' : 'var(--blue)';

  // 7-day habit week
  const start = new Date();
  start.setHours(0,0,0,0);
  start.setDate(start.getDate() - start.getDay() - UI.habitOffset * 7);
  const days = Array.from({length: 7}, (_, i) => {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    return { d, iso, letter: 'SMTWTFS'[i] };
  });
  const rangeStr = `${days[0].d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})} – ${days[6].d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}`;

  let dayDetailHtml = '';
  if (UI.selectedHabitDate) {
    const list = DB.sessions.filter(s => s.date === UI.selectedHabitDate);
    dayDetailHtml = `<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border)">
      <div class="row-between" style="margin-bottom:8px">
        <strong>${fmtDate(UI.selectedHabitDate)}</strong>
        <span style="color:var(--blue);font-size:12px;font-weight:700">${list.length} सेशन · ${fmtMin(list.reduce((a,b)=>a+b.durationMinutes,0))}</span>
      </div>
      ${list.length ? list.map(s => `<div class="row-between" style="padding:8px 10px;border-radius:10px;background:var(--subtle);margin-bottom:6px">
        <div style="border-left:3px solid ${subCol(s.subject)};padding-left:8px;min-width:0;flex:1">
          <div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.subject)} › ${esc(s.chapter)}</div>
          <div class="muted" style="font-size:12px">${esc(s.lecture)} · <span style="color:${statusMeta(s.status).col}">${statusMeta(s.status).label}</span></div>
        </div>
        <span class="mono" style="color:var(--blue);font-weight:700">${s.durationMinutes}m</span>
      </div>`).join('') : `<div class="muted" style="font-size:12.5px">इस दिन कोई सेशन दर्ज नहीं है।</div>`}
    </div>`;
  }

  // Subject breakdown
  const subMap = {};
  DB.sessions.forEach(s => {
    if (!subMap[s.subject]) subMap[s.subject] = { min:0, easy:0, med:0, hard:0 };
    subMap[s.subject].min += s.durationMinutes || 0;
    if (s.status === 'Easy') subMap[s.subject].easy++;
    else if (s.status === 'Hard') subMap[s.subject].hard++;
    else subMap[s.subject].med++;
  });
  const subArr = Object.entries(subMap).sort((a,b) => b[1].min - a[1].min).slice(0, 8);
  const maxM = Math.max(1, ...subArr.map(x => x[1].min));

  return `
    <div class="card" style="cursor:pointer" onclick="openDailyGoalSheet()">
      <div class="row-between">
        <div>
          <div class="lbl-sm">DAILY STUDY GOAL</div>
          <div style="font-size:16px;font-weight:700;margin-top:2px">${goal > 0 ? `Today ${fmtMin(todayMin)} / ${fmtMin(goal)}` : 'Set daily goal'}</div>
        </div>
        <span class="pill mono" style="color:${barCol};border-color:${barCol}">${goal > 0 ? pct + '%' : 'सेट करें'}</span>
      </div>
      <div class="bar-track" style="margin-top:12px;height:7px"><div class="bar-fill" style="width:${Math.min(100, pct)}%;background:${barCol}"></div></div>
    </div>

    <div class="grid2">
      <div class="card"><div class="lbl-sm">TODAY'S TIME</div><div class="mono" style="font-size:24px;font-weight:700;color:var(--blue);margin-top:6px">${fmtMin(todayMin)}</div></div>
      <div class="card"><div class="lbl-sm">TODAY SESSIONS</div><div class="mono" style="font-size:24px;font-weight:700;color:var(--emerald);margin-top:6px">${todaySess.length}</div></div>
      <div class="card"><div class="lbl-sm">TODAY SUBJECTS</div><div class="mono" style="font-size:24px;font-weight:700;color:var(--amber);margin-top:6px">${todaySubs}</div></div>
      <div class="card"><div class="lbl-sm">TODAY CHAPTERS</div><div class="mono" style="font-size:24px;font-weight:700;color:var(--purple);margin-top:6px">${todayChaps}</div></div>
    </div>

    <div class="card">
      <div class="row-between">
        <button class="icon-btn" onclick="UI.habitOffset++;UI.selectedHabitDate=null;renderMainPage()">‹</button>
        <button style="font-weight:700;font-size:14px" onclick="UI.habitOffset=0;UI.selectedHabitDate=null;renderMainPage()">${UI.habitOffset>0?'<span style="color:var(--blue)">● </span>':''}${rangeStr}</button>
        <button class="icon-btn" ${UI.habitOffset===0?'disabled style="opacity:.3"':''} onclick="if(UI.habitOffset>0){UI.habitOffset--;UI.selectedHabitDate=null;renderMainPage()}">›</button>
      </div>
      <div class="habit-grid">
        ${days.map(x => {
          const cnt = DB.sessions.filter(s => s.date === x.iso).length;
          const isToday = x.iso === today;
          const isFuture = x.iso > today;
          const isSel = UI.selectedHabitDate === x.iso;
          return `<button class="habit-cell" ${isFuture?'disabled':''} onclick="UI.selectedHabitDate=(UI.selectedHabitDate==='${x.iso}'?null:'${x.iso}');renderMainPage()">
            <span class="lbl-sm" style="color:${isToday?'var(--blue)':'var(--muted)'}">${x.letter}</span>
            <div class="habit-box ${cnt>0?'active':''} ${isToday?'today':''} ${isSel?'selected':''}" style="${isFuture?'opacity:.35':''}">
              ${cnt > 0 ? (isToday ? '🔥'+cnt : cnt) : x.d.getDate()}
            </div>
          </button>`;
        }).join('')}
      </div>
      ${dayDetailHtml}
    </div>

    <div class="card">
      <div class="row-between" style="margin-bottom:12px">
        <span class="lbl-sm">SUBJECT-WISE BREAKDOWN</span>
        <span style="font-size:11px;color:var(--muted)">🟢 Clear · 🟡 Practice · 🔴 Relearn</span>
      </div>
      ${subArr.length ? subArr.map(([sub, st]) => {
        const tot = Math.max(1, st.easy + st.med + st.hard);
        const col = subCol(sub);
        return `<div style="margin-bottom:11px">
          <div class="row-between" style="margin-bottom:4px">
            <span style="font-weight:600"><span style="color:${col}">●</span> ${esc(sub)}</span>
            <span class="mono muted" style="font-size:12px">${fmtMin(st.min)}</span>
          </div>
          <div class="bar-track" style="margin-bottom:3px"><div class="bar-fill" style="width:${Math.max(6, Math.round(st.min/maxM*100))}%;background:${col}"></div></div>
          <div class="bar-track" style="height:4px">
            ${st.easy?`<div style="width:${st.easy/tot*100}%;background:var(--emerald)"></div>`:''}
            ${st.med?`<div style="width:${st.med/tot*100}%;background:var(--amber)"></div>`:''}
            ${st.hard?`<div style="width:${st.hard/tot*100}%;background:var(--red)"></div>`:''}
          </div>
        </div>`;
      }).join('') : `<div class="muted" style="font-size:13px">अभी कोई अध्ययन सत्र नहीं है। पहला सेशन जोड़ने पर विषय-वार विश्लेषण यहाँ दिखेगा।</div>`}
    </div>
  `;
}

// ================= HISTORY TAB =================
function renderNoteCardsHtml(cards) {
  if (!cards || !cards.length) return '';
  return `<div class="note-box">${cards.map(c => {
    const urls = extractUrls(c.content);
    const formatted = esc(c.content)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/==(.+?)==/g, '<mark style="background:rgba(251,191,36,0.3);color:inherit;padding:0 3px;border-radius:4px">$1</mark>')
      .replace(/~~(.+?)~~/g, '<s>$1</s>')
      .replace(/__(.+?)__/g, '<u>$1</u>')
      .replace(/\n/g, '<br>');
    return `<div class="note-card" style="border-color:${esc(c.colorHex || '#38BDF8')}55">
      <div class="row" style="margin-bottom:4px;font-size:12px;font-weight:700;color:${esc(c.colorHex || '#38BDF8')}">
        <span>● ${esc(c.labelName || 'सामान्य')}</span>${c.pinned ? ' <span>📌</span>' : ''}
      </div>
      <div style="font-size:13px">${formatted}</div>
      ${urls.length ? `<div style="margin-top:6px;display:flex;flex-direction:column;gap:4px">${urls.map(u => `<a href="${esc(u)}" target="_blank" style="color:var(--blue);font-size:12px;word-break:break-all">↗ ${esc(u)}</a>`).join('')}</div>` : ''}
    </div>`;
  }).join('')}</div>`;
}

      </div>
      <div class="col" style="align-items:flex-end;gap:4px">
        <div class="row"><span style="font-size:12px">${cards.length?'📝':''}</span><span class="mono" style="color:var(--blue);font-weight:700">${s.durationMinutes}m</span></div>

        </div>

    </div>
    ${exp ? renderNoteCardsHtml(cards) : ''}
  </div>`;

        <div class="grid2">
          <div class="card"><div class="lbl-sm">रिवीजन</div><div class="mono" style="font-size:20px;font-weight:700;color:var(--blue)">${recs.length}</div></div>
          <div class="card"><div class="lbl-sm">कुल समय</div><div class="mono" style="font-size:20px;font-weight:700;color:var(--emerald)">${fmtMin(totMin)}</div></div>
          <div class="card"><div class="lbl-sm">लेक्चर</div><div class="mono" style="font-size:20px;font-weight:700;color:var(--purple)">${doneLecs}/${Math.max(lecs.length, doneLecs)}</div></div>
          <div class="card"><div class="lbl-sm">आख़िरी</div><div class="mono" style="font-size:18px;font-weight:700;color:var(--amber)">${fmtDate(last)}</div></div>
        </div>
        ${recs.length ? recs.sort((a,b)=>b.timestamp-a.timestamp).map(s => buildHistoryCardItem(s)).join('') : `<div class="empty"><div class="muted">इस अध्याय का अभी कोई रिवीजन रिकॉर्ड नहीं है।</div></div>`}
      `;
    } else {
      const recs = DB.sessions.filter(s => s.subject === d.sub && s.chapter === d.chap && s.lecture === d.lec).sort((a,b)=>b.timestamp-a.timestamp);
      const totMin = recs.reduce((a,b)=>a+b.durationMinutes, 0);
      const avg = recs.length ? Math.round(totMin / recs.length) : 0;
      const easy = recs.filter(r=>r.status==='Easy').length, med = recs.filter(r=>r.status==='Medium').length, hard = recs.filter(r=>r.status==='Hard').length;
      const tot = Math.max(1, recs.length);
      return `
        <div class="pill" style="color:${col};border-color:${col}55;cursor:pointer" onclick="backSyllabusDetail()">${esc(d.sub)} › ${esc(d.chap)} › ${esc(d.lec)}</div>
        <div class="grid2">
          <div class="card"><div class="lbl-sm">रिवीजन</div><div class="mono" style="font-size:20px;font-weight:700;color:var(--blue)">${recs.length}</div></div>
          <div class="card"><div class="lbl-sm">कुल समय</div><div class="mono" style="font-size:20px;font-weight:700;color:var(--emerald)">${fmtMin(totMin)}</div></div>
          <div class="card"><div class="lbl-sm">औसत</div><div class="mono" style="font-size:20px;font-weight:700;color:var(--purple)">${fmtMin(avg)}</div></div>
          <div class="card"><div class="lbl-sm">आख़िरी</div><div class="mono" style="font-size:18px;font-weight:700;color:var(--amber)">${fmtDate(recs[0]?.date||'')}</div></div>
        </div>
        ${recs.length ? `<div class="card">
          <div class="row-between" style="margin-bottom:8px"><strong>Status Breakdown</strong><span class="muted" style="font-size:11.5px">पहला: ${fmtDate(recs[recs.length-1].date)}</span></div>
          <div class="bar-track" style="height:8px;margin-bottom:8px">
            ${easy?`<div style="width:${easy/tot*100}%;background:var(--emerald)"></div>`:''}
            ${med?`<div style="width:${med/tot*100}%;background:var(--amber)"></div>`:''}
            ${hard?`<div style="width:${hard/tot*100}%;background:var(--red)"></div>`:''}
          </div>
          <div class="row" style="font-size:12px"><span style="color:var(--emerald)">Clear: ${easy}</span><span style="color:var(--amber)">Practice: ${med}</span><span style="color:var(--red)">Relearn: ${hard}</span></div>
        </div>` + recs.map((s, i) => `<div class="card">
          <div class="row-between" style="margin-bottom:6px">
            <span class="pill" style="color:${col}">रिवीजन #${recs.length - i}</span>
            <span class="muted" style="font-size:12px">${fmtDate(s.date)}</span>
            <span class="mono" style="color:var(--blue);font-weight:700">${s.durationMinutes}m</span>
          </div>
          <span class="pill" style="color:${statusMeta(s.status).col}">${statusMeta(s.status).label}</span>
          ${renderNoteCardsHtml(s.noteCards)}
        </div>`).join('') : `<div class="empty"><div class="muted">यह लेक्चर अभी शुरू नहीं हुआ है।</div></div>`}
      `;
    }
  }

  const q = UI.syllabusSearch.trim().toLowerCase();
  const subs = Object.entries(DB.syllabus).filter(([sub, chaps]) =>
    !q || sub.toLowerCase().includes(q) || Object.keys(chaps).some(c => c.toLowerCase().includes(q))
  );
  const totalChaps = Object.values(DB.syllabus).reduce((a, c) => a + Object.keys(c).length, 0);

  const summary = `<div class="card" style="padding:10px 14px"><div class="row-between">
    <strong style="color:var(--blue)">${Object.keys(DB.syllabus).length} विषय · ${totalChaps} अध्याय</strong>
    <span class="muted" style="font-size:11.5px">टैप करें → चैप्टर व लेक्चर</span>
  </div></div>`;

  return summary + `<div class="${UI.syllabusView==='grid'?'grid2':'col'}" style="gap:10px">${subs.map(([sub, chaps]) => {
    const chNames = Object.keys(chaps);
    const subSess = DB.sessions.filter(s => s.subject === sub);
    const started = new Set(subSess.map(s => s.chapter)).size;
    const totMin = subSess.reduce((a,b)=>a+b.durationMinutes, 0);
    const pct = chNames.length ? Math.round((started / chNames.length) * 100) : 0;
    const col = subCol(sub);
    return `<div class="card" style="cursor:pointer" onclick="openSyllabusDrawer('${esc(sub).replace(/'/g,"\\'")}')">
      <div class="row-between" style="margin-bottom:8px">
        <div class="row" style="min-width:0;flex:1">
          <div class="sub-stripe" style="background:${col};min-height:30px"></div>
          <div style="min-width:0"><div style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(sub)}</div>
          <div class="muted" style="font-size:12px">${subSess.length} रिवीजन · ${fmtMin(totMin)}</div></div>
        </div>
        <span class="pill mono" style="color:${col};border-color:${col}55">${started}/${chNames.length}</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${col}"></div></div>
    </div>`;
  }).join('')}</div>`;
}

// ================= TWO-LEVEL SYLLABUS DRAWER =================
function openSyllabusDrawer(sub) {
  UI.drawerSub = sub; UI.drawerChap = null;
  document.getElementById('backdrop').classList.add('open');
  document.getElementById('syllabusDrawer').classList.add('open');
  renderSyllabusDrawer();
}
function renderSyllabusDrawer() {
  const el = document.getElementById('syllabusDrawer');
  const sub = UI.drawerSub;
  if (!sub) return;
  const col = subCol(sub);
  const chaps = DB.syllabus[sub] || {};
  const subSess = DB.sessions.filter(s => s.subject === sub);
  if (!UI.drawerChap) {
    el.innerHTML = `<div class="sheet-head">
      <div class="row"><span style="color:${col}">●</span><strong>${esc(sub)}</strong></div>
      <button class="icon-btn" onclick="closeDrawers()">✕</button>
    </div>
    <div class="sheet-body" style="gap:8px">
      ${Object.entries(chaps).map(([ch, lecs]) => {
        const cnt = subSess.filter(s => s.chapter === ch).length;
        return `<div class="card" style="padding:11px 13px;cursor:pointer" onclick="UI.drawerChap='${esc(ch).replace(/'/g,"\\'")}';renderSyllabusDrawer()">
          <div class="row-between">
            <div><div style="font-weight:600">${esc(ch)}</div><div class="muted" style="font-size:11.5px">${lecs.length} लेक्चर</div></div>
            ${cnt ? `<span class="pill mono" style="color:var(--emerald)">${cnt}</span>` : `<span class="muted">○</span>`}
          </div>
        </div>`;
      }).join('')}
    </div>`;
  } else {
    const ch = UI.drawerChap;
    const lecs = chaps[ch] || [];
    const chSess = subSess.filter(s => s.chapter === ch);
    el.innerHTML = `<div class="sheet-head">
      <div class="row"><button class="icon-btn" onclick="UI.drawerChap=null;renderSyllabusDrawer()">←</button><strong>${esc(ch)}</strong></div>
      <button class="icon-btn" onclick="closeDrawers()">✕</button>
    </div>
    <div class="sheet-body" style="gap:8px">
      <div class="card" style="border-color:${col};background:color-mix(in srgb, ${col} 15%, transparent);cursor:pointer" onclick="openChapterDetail('${esc(sub).replace(/'/g,"\\'")}','${esc(ch).replace(/'/g,"\\'")}')">
        <div class="row-between"><strong style="color:${col}">📚 All Lectures (सभी लेक्चर)</strong><span class="mono" style="color:${col}">${chSess.length}</span></div>
      </div>
      ${lecs.map(l => {
        const cnt = chSess.filter(s => s.lecture === l).length;
        return `<div class="card" style="padding:11px 13px;cursor:pointer" onclick="openLectureDetail('${esc(sub).replace(/'/g,"\\'")}','${esc(ch).replace(/'/g,"\\'")}','${esc(l).replace(/'/g,"\\'")}')">
          <div class="row-between"><span>${esc(l)}</span>${cnt?`<span class="pill" style="color:var(--blue)">${cnt} रिवीजन</span>`:`<span class="muted">○</span>`}</div>
        </div>`;
      }).join('')}
    </div>`;
  }
}

// ================= STUDY SESSION COCKPIT =================
function openStudySession() {
  UI.studyOpen = true; UI.studyError = '';
  document.getElementById('studyOverlay').classList.add('open');
  renderStudyOverlay();
}
function closeStudySession() {
  UI.studyOpen = false;
  document.getElementById('studyOverlay').classList.remove('open');
  renderAll();
}
function activeDraftNotes() {
  return (DB.draft.isTimerMode || DB.draft.isRunning || DB.draft.elapsedSeconds > 0) ? DB.draft.timerNotes : DB.draft.manualNotes;
}
function renderStudyOverlay() {
  const d = DB.draft;
  const locked = d.isRunning || d.elapsedSeconds > 0 || d.isReviewingStopped;
  const showTimer = d.isTimerMode || d.isRunning || d.elapsedSeconds > 0;
  const notes = activeDraftNotes();
  const litTicks = Math.min(60, Math.floor((d.elapsedSeconds % 3600) / 60));

  const timeCard = !showTimer ? `
    <div class="card" style="background:var(--study-card)">
      <div class="row-between" style="margin-bottom:14px">
        <div class="row">
          <button class="icon-btn" style="border:1px solid var(--border)" onclick="setManualMin(DB.draft.manualMinutes-1)">−</button>
          <input class="input mono" type="number" min="1" max="1440" value="${d.manualMinutes}" style="width:92px;text-align:center;font-size:24px;font-weight:700" onchange="setManualMin(parseInt(this.value,10)||25)">
          <span class="muted">min</span>
          <button class="icon-btn" style="border:1px solid var(--border)" onclick="setManualMin(DB.draft.manualMinutes+1)">+</button>
        </div>
        <button class="icon-btn" style="width:52px;height:52px;background:var(--emerald);color:#fff;font-size:22px" onclick="startLiveTimer()">▶</button>
      </div>
      <input type="range" min="5" max="180" step="1" value="${Math.min(180, Math.max(5, d.manualMinutes))}" style="width:100%;accent-color:var(--emerald)" oninput="setManualMin(parseInt(this.value,10))">
      <div class="grid4" style="margin-top:12px">
        ${[15,25,45,60].map(m => `<button class="pill mono ${d.manualMinutes===m?'active':''}" style="justify-content:center;padding:8px" onclick="setManualMin(${m})">${m}m</button>`).join('')}
      </div>
    </div>` : `
    <div class="card" style="background:var(--study-card);border-color:${d.isRunning?'var(--emerald)':'var(--amber)'}">
      <div class="row-between" style="margin-bottom:12px">
        <div>
          <div style="font-size:12px;font-weight:700;color:${d.isRunning?'var(--emerald)':'var(--amber)'}">● ${d.isRunning?'Focusing':'Paused'}</div>
          <div class="mono" style="font-size:38px;font-weight:700">${fmtClock(d.elapsedSeconds)}</div>
        </div>
        <div class="row">
          <button class="icon-btn" style="border:1px solid var(--emerald);color:var(--emerald)" onclick="toggleTimerPause()">${d.isRunning?'⏸':'▶'}</button>
          <button class="icon-btn" style="border:1px solid var(--red);color:var(--red)" onclick="stopTimerForReview()">■</button>
          <button class="icon-btn" style="border:1px solid var(--border)" onclick="resetTimer()">↺</button>
        </div>
      </div>
      <div class="chrono-ticks">
        ${Array.from({length:60}, (_, i) => {
          const lit = i < litTicks || (d.elapsedSeconds > 0 && i === 0);
          const h = i % 5 === 0 ? 28 : 15;
          return `<div class="chrono-tick ${lit?'lit':''} ${!d.isRunning?'paused':''}" style="height:${h}px"></div>`;
        }).join('')}
      </div>
      <div class="muted" style="font-size:11.5px;margin-top:8px">${d.isRunning?'लाइव सेशन चल रहा है · बैकग्राउंड में भी चलता रहेगा':'रुका हुआ है · जारी रखें या End दबाएँ'}</div>
    </div>`;

  const footer = d.isReviewingStopped ? `
    <div class="row"><button class="icon-btn" style="color:var(--emerald)" onclick="toggleTimerPause()">▶</button><strong>${Math.max(1, Math.round(d.elapsedSeconds/60))} Min · ${statusMeta(d.status).label}</strong></div>
    <div class="row"><button class="btn emerald" onclick="saveStudySession()">Save</button><button class="icon-btn" onclick="resetTimer()">✕</button></div>`
    : (d.isRunning || d.elapsedSeconds > 0) ? `
    <span class="mono" style="font-weight:700">${d.isRunning?'🟢 Focusing':'🟡 Paused'} · ${fmtClock(d.elapsedSeconds)}</span>
    <button class="btn red" onclick="stopTimerForReview()">End</button>`
    : `<div><strong class="mono">${d.manualMinutes} min · ${statusMeta(d.status).label}</strong><div class="muted" style="font-size:11.5px">${d.mode==='First Study'?'नया':'रिवीजन'}</div></div>
    <button class="btn" onclick="saveStudySession()">Save Session</button>`;

  document.getElementById('studyOverlay').innerHTML = `
    <div class="topbar-row" style="border-bottom:1px solid var(--border);padding-top:calc(10px + env(safe-area-inset-top, 0px))">
      <button class="icon-btn" onclick="closeStudySession()">←</button>
      <div class="topbar-title">Study Session</div>
      <div class="row" style="background:var(--study-card);border:1px solid var(--border);border-radius:99px;padding:3px">
        <button class="pill ${d.mode==='Revision'?'active':''}" style="border:none" ${locked?'disabled':''} onclick="DB.draft.mode='Revision';saveStore();renderStudyOverlay()">Revision</button>
        <button class="pill ${d.mode==='First Study'?'active':''}" style="border:none" ${locked?'disabled':''} onclick="DB.draft.mode='First Study';saveStore();renderStudyOverlay()">First Study</button>
      </div>
    </div>
    <div class="overlay-body">
      <div class="card" style="background:var(--study-card)">
        <div class="thread-step" onclick="${locked?'':'openStudyPicker(\'subject\')'}">
          <div><div class="thread-node ${d.subject?'done':''}">${d.subject?'✓':'•'}</div><div class="thread-line ${d.subject?'done':''}"></div></div>
          <div><div class="lbl-sm">SUBJECT</div><div style="font-weight:600">${esc(d.subject || 'विषय चुनें...')}</div></div>
        </div>
        <div class="thread-step" onclick="${locked||!d.subject?'':'openStudyPicker(\'chapter\')'}">
          <div><div class="thread-node ${d.chapter?'done':''}">${d.chapter?'✓':'•'}</div><div class="thread-line ${d.chapter?'done':''}"></div></div>
          <div><div class="lbl-sm">CHAPTER</div><div style="font-weight:600">${esc(d.chapter || (d.subject?'अध्याय चुनें...':'पहले विषय चुनें'))}</div></div>
        </div>
        <div class="thread-step" onclick="${locked||!d.chapter?'':'openStudyPicker(\'lecture\')'}">
          <div><div class="thread-node ${d.lecture?'done':''}">${d.lecture?'✓':'•'}</div></div>
          <div><div class="lbl-sm">LECTURE</div><div style="font-weight:600">${esc(d.lecture || (d.chapter?'लेक्चर चुनें...':'पहले अध्याय चुनें'))}</div></div>
        </div>
      </div>

      ${timeCard}

      <div class="card" style="background:var(--study-card)">
        <div class="row-between" style="margin-bottom:10px">
          <span class="lbl-sm">LEARNING STATUS</span>
          <button style="color:var(--blue);font-size:12px;font-weight:700" onclick="openStatusGuideSheet()">ⓘ गाइड</button>
        </div>
        <div class="grid3" style="margin-bottom:12px">
          ${[['Easy','Clear','पक्का समझ आया'],['Medium','Practice','अभ्यास ज़रूरी'],['Hard','Relearn','दोबारा पढ़ना']].map(([k,t,s]) => {
            const on = d.status === k, col = statusMeta(k).col;
            return `<button class="card" style="padding:10px 6px;text-align:center;border-color:${on?col:'var(--border)'};background:${on?`color-mix(in srgb, ${col} 18%, transparent)`:'var(--subtle)'}" onclick="DB.draft.status='${k}';saveStore();renderStudyOverlay()">
              <div style="font-weight:700;color:${on?col:'var(--text)'}">${t}</div>
              <div class="muted" style="font-size:10.5px">${s}</div>
            </button>`;
          }).join('')}
        </div>
        <div class="divider" style="margin-bottom:12px"></div>
        <button class="row-between" style="width:100%;padding:11px 12px;border-radius:12px;background:var(--subtle);border:1px solid var(--border)" onclick="openNotesEditor()">
          <span>${notes.length ? `📝 ${notes.length} नोट कार्ड्स जुड़े हैं` : 'सूत्र, ट्रिक या लिंक जोड़ें'}</span>
          <span style="color:var(--blue);font-weight:700">${notes.length ? '↗' : '+'}</span>
        </button>
      </div>

      ${UI.studyError ? `<div class="card" style="border-color:var(--red);color:var(--red);padding:10px 14px;font-weight:600">${esc(UI.studyError)}</div>` : ''}
      <div class="muted" style="text-align:center;font-style:italic;font-size:12.5px">"गति से ज़्यादा ज़रूरी है, चलते रहना।"</div>
    </div>
    <div class="sticky-dock">${footer}</div>
  `;
}

function openNotesEditor() {
  UI.notesOpen = true; UI.notesEditingId = null;
  document.getElementById('notesOverlay').classList.add('open');
  renderNotesOverlay();
}
function closeNotesEditor() {
  UI.notesOpen = false; UI.notesEditingId = null;
  document.getElementById('notesOverlay').classList.remove('open');
  renderStudyOverlay();
}
function setActiveDraftNotes(fn) {
  if (DB.draft.isTimerMode || DB.draft.isRunning || DB.draft.elapsedSeconds > 0) DB.draft.timerNotes = fn(DB.draft.timerNotes);
  else DB.draft.manualNotes = fn(DB.draft.manualNotes);
  saveStore();
}
function renderNotesOverlay() {
  const el = document.getElementById('notesOverlay');
  const notes = activeDraftNotes();
  if (UI.notesEditingId) {
    const card = notes.find(c => c.id === UI.notesEditingId);
    if (!card) { UI.notesEditingId = null; renderNotesOverlay(); return; }
    el.innerHTML = `
      <div class="topbar-row" style="border-bottom:1px solid var(--border);padding-top:calc(10px + env(safe-area-inset-top,0px))">
        <button class="icon-btn" onclick="UI.notesEditingId=null;renderNotesOverlay()">✕</button>
        <div class="topbar-title" style="color:${esc(card.colorHex)}">● ${esc(card.labelName)}</div>
        <button class="icon-btn" onclick="noteEditUndo()">↶</button>
        <button class="icon-btn" onclick="noteEditRedo()">↷</button>

      </div>
      <div style="flex:1;padding:14px;display:flex">

      </div>
      <div class="fmt-bar">
        <button class="fmt-btn" onclick="fmtWrap('**','**','मुख्य')">B</button>
        <button class="fmt-btn" onclick="fmtWrap('*','*','तिरछा')">I</button>
        <button class="fmt-btn" onclick="fmtWrap('__','__','रेखांकित')">U</button>
        <button class="fmt-btn" onclick="fmtWrap('~~','~~','कटा')">S</button>
        <button class="fmt-btn" onclick="fmtLine('## ')">H2</button>
        <button class="fmt-btn" onclick="fmtLine('- ')">• List</button>
        <button class="fmt-btn" onclick="fmtLine('1. ')">1. List</button>
        <button class="fmt-btn" onclick="fmtLine('[ ] ')">☑ Check</button>
        <button class="fmt-btn" onclick="fmtLine('> ')">❝ Quote</button>
        <button class="fmt-btn" onclick="fmtWrap('==','==','खास')">Highlight</button>
        <button class="fmt-btn" onclick="fmtLine('---')">—</button>
        <button class="fmt-btn" onclick="insertLinkPrompt()">🔗 Link</button>
      </div>`;
    return;
  }

  let body = '';
  if (UI.notesTab === 0) {
    const visible = notes.filter(c => !UI.notesFilterLabel || c.labelId === UI.notesFilterLabel)
      .sort((a,b) => (b.pinned?1:0) - (a.pinned?1:0));
    body = `
      <div class="row" style="overflow-x:auto;padding-bottom:4px">
        <button class="pill ${!UI.notesFilterLabel?'active':''}" onclick="UI.notesFilterLabel=null;renderNotesOverlay()">All (${notes.length})</button>
        ${DB.labels.map(l => `<button class="pill ${UI.notesFilterLabel===l.id?'active':''}" style="border-color:${l.colorHex}66;color:${UI.notesFilterLabel===l.id?l.colorHex:'var(--text)'}" onclick="UI.notesFilterLabel='${l.id}';renderNotesOverlay()">● ${esc(l.name)}</button>`).join('')}
        <button class="pill" onclick="promptAddLabel()">+ लेबल</button>
      </div>
      ${visible.length ? visible.map(c => `<div class="card" style="border-color:${esc(c.colorHex)}55">
        <div class="row-between" style="margin-bottom:6px">
          <strong style="color:${esc(c.colorHex)};cursor:pointer" onclick="startEditNote('${c.id}')">● ${esc(c.labelName)} ${c.pinned?'📌':''}</strong>
          <div class="row" style="gap:2px">
            <button class="icon-btn" style="width:32px;height:32px" onclick="togglePinNote('${c.id}')" title="Pin">📌</button>
            <button class="icon-btn" style="width:32px;height:32px" onclick="startEditNote('${c.id}')" title="Edit">✎</button>

    `;
  }

  el.innerHTML = `
    <div class="topbar-row" style="border-bottom:1px solid var(--border);padding-top:calc(10px + env(safe-area-inset-top,0px))">
      <button class="icon-btn" onclick="closeNotesEditor()">←</button>

      <button class="icon-btn" onclick="${UI.notesTab===0?'addNewNoteCard()':'promptAddLink()'}">+</button>
    </div>
    <div class="overlay-body">${body}</div>
    <div class="sticky-dock">
      <button class="btn ${UI.notesTab===0?'':'outline'} full" onclick="UI.notesTab=0;renderNotesOverlay()">📝 Notes</button>
      <button class="btn ${UI.notesTab===1?'':'outline'} full" onclick="UI.notesTab=1;renderNotesOverlay()">🔗 Links</button>

// ================= ACTIONS =================
function switchTab(i) { UI.tab = i; UI.selectedHistory.clear(); renderAll(); }
function openSearch() { if (UI.tab===1) UI.historySearchOpen=true; else UI.syllabusSearchOpen=true; renderTopBar(); }
function closeSearch() { UI.historySearchOpen=false; UI.historySearch=''; UI.syllabusSearchOpen=false; UI.syllabusSearch=''; renderAll(); }
function onSearchInput(v) { if (UI.tab===1) UI.historySearch=v; else UI.syllabusSearch=v; renderMainPage(); }
function cycleViewMode() {
  const cur = UI.tab===1 ? UI.historyView : UI.syllabusView;
  const next = VIEW_MODES[(VIEW_MODES.indexOf(cur)+1)%VIEW_MODES.length];
  if (UI.tab===1) UI.historyView = next; else UI.syllabusView = next;
  renderAll();
}
function onHistoryTap(id) {
  if (UI.selectedHistory.size) { toggleSelectHistory(id); return; }
  if (UI.expandedNotes.has(id)) UI.expandedNotes.delete(id); else UI.expandedNotes.add(id);
  renderMainPage();
}
function toggleSelectHistory(id) {
  if (UI.selectedHistory.has(id)) UI.selectedHistory.delete(id); else UI.selectedHistory.add(id);
  renderAll();
}
function selectAllHistory() {
  const vis = getFilteredHistory();
  if (UI.selectedHistory.size === vis.length) UI.selectedHistory.clear();
  else vis.forEach(s => UI.selectedHistory.add(s.id));
  renderAll();
}
function deleteSelectedHistory() {
  const ids = new Set(UI.selectedHistory);
  const removed = DB.sessions.filter(s => ids.has(s.id));
  DB.sessions = DB.sessions.filter(s => !ids.has(s.id));
  UI.selectedHistory.clear();
  saveStore(); renderAll();
  showToast(`${removed.length} रिकॉर्ड हटाए गए`, 'पूर्ववत', () => {
    DB.sessions = [...removed, ...DB.sessions]; saveStore(); renderAll();
  });
}
function resetHistoryFilters() {
  UI.historyFilter = { sort:'newest', timeMode:'none', months:[], years:[], from:'', to:'', exact:'', pastDays:7, pastExactAgo:false, subjects:[], modes:[], statuses:[] };
  UI.historySearch = ''; UI.historySearchOpen = false;
  renderAll();
}
function openChapterDetail(sub, chap) { closeDrawers(); UI.syllabusDetail = { type:'chapter', sub, chap }; renderAll(); }
function openLectureDetail(sub, chap, lec) { closeDrawers(); UI.syllabusDetail = { type:'lecture', sub, chap, lec }; renderAll(); }
function backSyllabusDetail() {
  if (UI.syllabusDetail?.type === 'lecture') UI.syllabusDetail = { type:'chapter', sub: UI.syllabusDetail.sub, chap: UI.syllabusDetail.chap };
  else UI.syllabusDetail = null;
  renderAll();
}
function setManualMin(v) { DB.draft.manualMinutes = Math.min(1440, Math.max(1, v || 25)); saveStore(); renderStudyOverlay(); }
function validateDraft() {
  if (!DB.draft.subject) { UI.studyError = 'कृपया पहले विषय (Subject) चुनें।'; renderStudyOverlay(); return false; }
  if (!DB.draft.chapter) { UI.studyError = 'कृपया अध्याय (Chapter) चुनें।'; renderStudyOverlay(); return false; }
  if (!DB.draft.lecture) { UI.studyError = 'कृपया लेक्चर (Lecture) चुनें।'; renderStudyOverlay(); return false; }
  UI.studyError = ''; return true;
}
function startLiveTimer() {
  if (!validateDraft()) return;
  DB.draft.isTimerMode = true; DB.draft.isRunning = true; DB.draft.isReviewingStopped = false; DB.draft.startedAt = Date.now();
  saveStore(); startTimerLoop(); renderStudyOverlay(); renderFab();
}
function toggleTimerPause() {
  DB.draft.isRunning = !DB.draft.isRunning;
  DB.draft.isReviewingStopped = false;
  DB.draft.startedAt = DB.draft.isRunning ? Date.now() : 0;
  saveStore();
  if (DB.draft.isRunning) startTimerLoop(); else clearInterval(timerInterval);
  renderStudyOverlay(); renderFab();
}
function stopTimerForReview() {
  if (DB.draft.elapsedSeconds < 10) { UI.studyError = 'सेशन सहेजने के लिए कम से कम 10 सेकंड पढ़ाई ज़रूरी है।'; renderStudyOverlay(); return; }
  clearInterval(timerInterval);
  DB.draft.isRunning = false; DB.draft.isReviewingStopped = true; DB.draft.startedAt = 0;
  saveStore(); renderStudyOverlay();
}
function resetTimer() {
  clearInterval(timerInterval);
  Object.assign(DB.draft, { isTimerMode:false, isRunning:false, elapsedSeconds:0, startedAt:0, isReviewingStopped:false, timerNotes:[] });
  saveStore(); renderStudyOverlay(); renderFab();
}
function saveStudySession() {
  if (!validateDraft()) return;
  const d = DB.draft;
  const mins = (d.isTimerMode || d.isReviewingStopped) ? Math.max(1, Math.round(d.elapsedSeconds / 60)) : d.manualMinutes;
  const cards = activeDraftNotes().filter(c => c.content.trim());
  DB.sessions.unshift({
    id: uid(), date: todayIso(), timestamp: Date.now(),
    subject: d.subject, chapter: d.chapter, lecture: d.lecture,
    durationMinutes: mins, mode: d.mode, status: d.status,
    noteCards: cards, plainNotes: cards.map(c => `[${c.labelName}] ${c.content}`).join('\n')
  });
  clearInterval(timerInterval);
  DB.draft = { subject:'', chapter:'', lecture:'', mode: DB.prefs.defaultMode, status: DB.prefs.defaultStatus, manualMinutes:25, isTimerMode:false, isRunning:false, elapsedSeconds:0, startedAt:0, isReviewingStopped:false, manualNotes:[], timerNotes:[] };
  saveStore();
  UI.studyOpen = false; document.getElementById('studyOverlay').classList.remove('open');
  UI.tab = 1; renderAll();
  showToast('Saved to History');
}

// Notes actions
function addNewNoteCard() {
  const lbl = DB.labels.find(l => l.id === UI.notesFilterLabel) || DB.labels[0] || DEFAULT_LABELS[0];
  const card = { id: uid(), labelId: lbl.id, labelName: lbl.name, colorHex: lbl.colorHex, content: '', pinned: false, createdAt: Date.now(), updatedAt: Date.now() };
  setActiveDraftNotes(list => [card, ...list]);
  startEditNote(card.id);
}
function startEditNote(id) {
  const c = activeDraftNotes().find(x => x.id === id);
  if (!c) return;
  UI.notesEditingId = id; UI.notesEditUndo = [c.content]; UI.notesEditIdx = 0;
  renderNotesOverlay();
}
function trackNoteUndo(v) {
  UI.notesEditUndo = UI.notesEditUndo.slice(0, UI.notesEditIdx + 1);
  UI.notesEditUndo.push(v); UI.notesEditIdx = UI.notesEditUndo.length - 1;
}
function noteEditUndo() {
  if (UI.notesEditIdx > 0) { UI.notesEditIdx--; document.getElementById('focusedNoteInput').value = UI.notesEditUndo[UI.notesEditIdx]; }
}
function noteEditRedo() {
  if (UI.notesEditIdx < UI.notesEditUndo.length - 1) { UI.notesEditIdx++; document.getElementById('focusedNoteInput').value = UI.notesEditUndo[UI.notesEditIdx]; }
}
function fmtWrap(a, b, ph) {
  const t = document.getElementById('focusedNoteInput');
  t.value = (t.value ? t.value + ' ' : '') + a + ph + b; trackNoteUndo(t.value);
}
function fmtLine(pref) {
  const t = document.getElementById('focusedNoteInput');
  t.value = (t.value && !t.value.endsWith('\n') ? t.value + '\n' : t.value) + pref; trackNoteUndo(t.value);
}
function insertLinkPrompt() {
  const u = prompt('URL दर्ज करें (https://...):');
  if (u) fmtLine(u.startsWith('http') ? u : 'https://' + u);
}
function saveFocusedNote() {
  const val = document.getElementById('focusedNoteInput').value;
  setActiveDraftNotes(list => list.map(c => c.id === UI.notesEditingId ? Object.assign({}, c, { content: val, updatedAt: Date.now() }) : c));
  UI.notesEditingId = null; renderNotesOverlay();
}
function togglePinNote(id) { setActiveDraftNotes(list => list.map(c => c.id === id ? Object.assign({}, c, { pinned: !c.pinned }) : c)); renderNotesOverlay(); }
function deleteNoteCard(id) { setActiveDraftNotes(list => list.filter(c => c.id !== id)); renderNotesOverlay(); }
function promptAddLabel() {
  const name = prompt('नए लेबल का नाम:');
  if (!name || !name.trim()) return;
  DB.labels.push({ id: uid(), name: name.trim(), colorHex: LABEL_PALETTE[DB.labels.length % LABEL_PALETTE.length], sortOrder: DB.labels.length });
  saveStore(); renderNotesOverlay();
}
function promptAddLink() {
  const url = prompt('URL (https://...):');
  if (!url || !url.trim()) return;
  const clean = url.trim().startsWith('http') ? url.trim() : 'https://' + url.trim();
  const title = prompt('लिंक का नाम:', clean.replace(/^https?:\/\/(www\.)?/, '').split('/')[0]) || clean;
  DB.links.unshift({ id: uid(), title: title.trim(), url: clean, createdAt: Date.now() });
  saveStore(); renderNotesOverlay();
}
function deleteSavedLink(id) { DB.links = DB.links.filter(l => l.id !== id); saveStore(); renderNotesOverlay(); }

// Prefs & Tools actions
function setPref(k, v) { DB.prefs[k] = v; saveStore(); renderAll(); }
function setDefaultView(m) { DB.prefs.defaultViewMode = m; UI.historyView = m; UI.syllabusView = m; saveStore(); renderAll(); }
function clearAllHistory() {
  if (!confirm('सारा इतिहास साफ़ करें?')) return;
  const backup = DB.sessions.slice();
  DB.sessions = []; saveStore(); closeDrawers(); renderAll();
  showToast('सारा इतिहास साफ़ किया गया', 'पूर्ववत', () => { DB.sessions = backup; saveStore(); renderAll(); });
}
function resetAllData() {
  if (!confirm('पूरा ऐप डेटा रीसेट करें?')) return;
  localStorage.removeItem(STORE_KEY);
  DB = loadStore(); saveStore(); closeDrawers(); renderAll();
  showToast('पूरा डेटा रीसेट किया गया');
}
function promptAddSubject() {
  const s = prompt('नए विषय का नाम:');
  if (!s || !s.trim()) return;
  if (!DB.syllabus[s.trim()]) DB.syllabus[s.trim()] = { 'Chapter 1': ['Lec 1'] };
  saveStore(); renderToolsOverlay();
}
function deleteSubject(s) {
  if (!confirm(`"${s}" हटाएँ?`)) return;
  const snap = JSON.parse(JSON.stringify(DB.syllabus));
  delete DB.syllabus[s]; saveStore(); renderToolsOverlay();
  showToast('विषय हटाया गया', 'पूर्ववत', () => { DB.syllabus = snap; saveStore(); renderToolsOverlay(); });
}
function promptAddChapter(sub) {
  const c = prompt('नए चैप्टर का नाम:');
  if (!c || !c.trim()) return;
  const n = Math.max(1, parseInt(prompt('लेक्चर संख्या:', '5'), 10) || 1);
  DB.syllabus[sub][c.trim()] = gen(n); saveStore(); renderToolsOverlay();
}
function deleteChapter(sub, c) { delete DB.syllabus[sub][c]; saveStore(); renderToolsOverlay(); }
function quickAddLecs(sub, chap, count) {
  const arr = DB.syllabus[sub][chap] || [];
  let maxN = Math.max(0, ...arr.map(lecNum).filter(x => x < 999999));
  for (let i = 0; i < count; i++) arr.push('Lec ' + (++maxN));
  DB.syllabus[sub][chap] = arr; saveStore(); renderToolsOverlay(); showToast(`+${count} लेक्चर जोड़े गए`);
}
function promptAddCustomLec(sub, chap) {
  const l = prompt('लेक्चर का नाम:');
  if (!l || !l.trim()) return;
  DB.syllabus[sub][chap].push(l.trim()); saveStore(); renderToolsOverlay();
}
function deleteLecture(sub, chap, l) {
  DB.syllabus[sub][chap] = DB.syllabus[sub][chap].filter(x => x !== l); saveStore(); renderToolsOverlay();
}
function restoreDefaultSyllabus() {
  Object.entries(DEFAULT_SYLLABUS).forEach(([s, chs]) => {
    if (!DB.syllabus[s]) DB.syllabus[s] = JSON.parse(JSON.stringify(chs));
    else Object.entries(chs).forEach(([c, lecs]) => {
      if (!DB.syllabus[s][c]) DB.syllabus[s][c] = lecs.slice();
      else lecs.forEach(l => { if (!DB.syllabus[s][c].includes(l)) DB.syllabus[s][c].push(l); });
    });
  });
  saveStore(); renderToolsOverlay(); showToast('डिफ़ॉल्ट सिलेबस बहाल हुआ');
}

// Import/Export Web
function downloadBlob(name, mime, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: mime }));
  a.download = name; a.click();
}
function downloadWebJson() {
  downloadBlob('data.json', 'application/json', JSON.stringify({ study_sessions: DB.sessions, syllabus: DB.syllabus, note_labels: DB.labels, saved_links: DB.links, preferences: DB.prefs }, null, 2));
}
function downloadWebCsv() {
  const escCsv = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = [['Date','Subject','Chapter','Lecture','Time(min)','Mode','Difficulty','Notes'], ...DB.sessions.map(s => [s.date, s.subject, s.chapter, s.lecture, s.durationMinutes, s.mode, statusMeta(s.status).label, s.plainNotes || ''])];
  downloadBlob(`revision_universe_${todayIso()}.csv`, 'text/csv;charset=utf-8', '\uFEFF' + rows.map(r => r.map(escCsv).join(',')).join('\r\n'));
}
function handleWebImport(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const txt = String(r.result || '').replace(/^\uFEFF/, '');
      if (file.name.endsWith('.json') || txt.trim().startsWith('{')) {
        const j = JSON.parse(txt);
        if (Array.isArray(j.study_sessions)) {
          const mapped = j.study_sessions.map(s => ({
            id: s.id || uid(), date: s.date || todayIso(), timestamp: s.timestamp || Date.now(),
            subject: s.subject, chapter: s.chapter, lecture: s.lecture || 'Lec 1',
            durationMinutes: s.durationMinutes || 25, mode: s.mode || 'Revision', status: s.status || 'Medium',
            noteCards: Array.isArray(s.noteCards) ? s.noteCards : (s.notesJson ? JSON.parse(s.notesJson) : []),
            plainNotes: s.plainNotes || ''
          }));
          DB.sessions = [...mapped, ...DB.sessions];
        }
        if (Array.isArray(j.syllabus_entries)) {
          j.syllabus_entries.forEach(e => {
            if (!DB.syllabus[e.subject]) DB.syllabus[e.subject] = {};
            if (!DB.syllabus[e.subject][e.chapter]) DB.syllabus[e.subject][e.chapter] = [];
            if (!DB.syllabus[e.subject][e.chapter].includes(e.lecture)) DB.syllabus[e.subject][e.chapter].push(e.lecture);
          });
        }
        if (Array.isArray(j.note_labels) && j.note_labels.length) DB.labels = j.note_labels;
        if (Array.isArray(j.saved_links)) DB.links = j.saved_links;
        saveStore(); renderAll(); showToast('data.json सफलतापूर्वक आयात हुआ');
      } else {
        const lines = txt.split(/\r?\n/).filter(Boolean).slice(1);
        lines.forEach(line => {
          const cols = line.split(',').map(x => x.replace(/^"|"$/g, '').trim());
          if (cols[1] && cols[2]) {
            DB.sessions.unshift({ id: uid(), date: cols[0] || todayIso(), timestamp: Date.now(), subject: cols[1], chapter: cols[2], lecture: cols[3] || 'Lec 1', durationMinutes: parseInt(cols[4], 10) || 25, mode: cols[5] || 'Revision', status: cols[6] === 'Clear' ? 'Easy' : cols[6] === 'Relearn' ? 'Hard' : 'Medium', noteCards: [], plainNotes: cols[7] || '' });
          }
        });
        saveStore(); renderAll(); showToast(`${lines.length} CSV रिकॉर्ड आयात हुए`);
      }
    } catch (e) { showToast('आयात फ़ाइल पढ़ने में त्रुटि'); }
  };
  r.readAsText(file);
}

// ================= BOTTOM SHEETS =================
function openSheet(html) {
  document.getElementById('sheetBox').innerHTML = html;
  document.getElementById('sheetWrap').classList.add('open');
}
function closeSheet() { document.getElementById('sheetWrap').classList.remove('open'); }

function openDailyGoalSheet() {
  let hrs = Math.max(0.5, (DB.prefs.dailyGoalMinutes || 180) / 60);
  const draw = () => openSheet(`
    <div class="sheet-head"><strong>दैनिक अध्ययन लक्ष्य (Daily Goal)</strong><button class="icon-btn" onclick="closeSheet()">✕</button></div>
    <div class="sheet-body">
      <div class="row" style="flex-wrap:wrap">${[1,2,3,4,6,8].map(h => `<button class="pill mono ${Math.abs(hrs-h)<0.01?'active':''}" onclick="window._setGoalHrs(${h})">${h}h</button>`).join('')}</div>
      <div class="row" style="justify-content:center;gap:20px;margin:10px 0">
        <button class="icon-btn" style="border:1px solid var(--border)" onclick="window._setGoalHrs(Math.max(0.5, ${hrs}-0.5))">−</button>
        <strong class="mono" style="font-size:28px;color:var(--blue)">${hrs}h</strong>
        <button class="icon-btn" style="border:1px solid var(--border)" onclick="window._setGoalHrs(Math.min(24, ${hrs}+0.5))">+</button>
      </div>
    </div>
    <div class="sheet-foot">
      <button class="btn outline" style="color:var(--red);flex:1" onclick="DB.prefs.dailyGoalMinutes=0;saveStore();closeSheet();renderAll()">हटाएँ</button>
      <button class="btn" style="flex:1.5" onclick="DB.prefs.dailyGoalMinutes=Math.round(${hrs}*60);saveStore();closeSheet();renderAll()">लक्ष्य सहेजें</button>
    </div>`);
  window._setGoalHrs = h => { hrs = h; draw(); };
  draw();
}

function openStudyPicker(step) {
  const opts = step === 'subject' ? Object.keys(DB.syllabus)
    : step === 'chapter' ? Object.keys(DB.syllabus[DB.draft.subject] || {})
    : ((DB.syllabus[DB.draft.subject] || {})[DB.draft.chapter] || []);
  let q = '';
  const draw = () => openSheet(`
    <div class="sheet-head"><strong>${step==='subject'?'विषय चुनें':step==='chapter'?'अध्याय चुनें':'लेक्चर चुनें'}</strong><button class="icon-btn" onclick="closeSheet()">✕</button></div>
    <div class="sheet-body" style="gap:8px">
      ${opts.length > 6 ? `<input class="input" placeholder="खोजें..." value="${esc(q)}" oninput="window._pickQ(this.value)">` : ''}
      ${opts.filter(o => !q || o.toLowerCase().includes(q.toLowerCase())).map(o => `<button class="card row-between" style="padding:12px;text-align:left" onclick="window._pickOpt('${esc(o).replace(/'/g,"\\'")}')">
        <span>${step==='subject'?`<span style="color:${subCol(o)}">● </span>`:''}${esc(o)}</span>
      </button>`).join('')}
    </div>`);
  window._pickQ = v => { q = v; draw(); };
  window._pickOpt = val => {
    if (step === 'subject') { DB.draft.subject = val; DB.draft.chapter = ''; DB.draft.lecture = ''; }
    else if (step === 'chapter') {
      DB.draft.chapter = val;
      const lecs = (DB.syllabus[DB.draft.subject] || {})[val] || [];
      DB.draft.lecture = lecs.length === 1 ? lecs[0] : '';
    } else DB.draft.lecture = val;
    UI.studyError = ''; saveStore(); closeSheet(); renderStudyOverlay();
  };
  draw();
}

function openStatusGuideSheet() {
  openSheet(`
    <div class="sheet-head"><strong>Session Status गाइड</strong><button class="icon-btn" onclick="closeSheet()">✕</button></div>
    <div class="sheet-body">
      <div class="card" style="border-color:var(--blue);font-size:12.5px">${STATUS_GUIDE.intro}</div>
      <strong>भाग 1: Session Status (3)</strong>
      ${STATUS_GUIDE.statuses.map(s => `<div class="card" style="padding:11px;border-color:${statusMeta(s.key).col}55">
        <strong style="color:${statusMeta(s.key).col}">${s.name} · ${s.sub}</strong>
        <div style="font-size:12.5px;margin-top:4px">${s.desc}</div>
        <div class="muted" style="font-size:12px;margin-top:3px">उदाहरण: ${s.ex}</div>
      </div>`).join('')}
      <strong>भाग 2: Notes के स्तर (5)</strong>
      ${STATUS_GUIDE.levels.map(l => `<div class="card" style="padding:10px"><strong>${l.name}</strong> · <span class="muted">${l.sub}</span><div style="font-size:12px;margin-top:3px">${l.desc}</div></div>`).join('')}
    </div>`);
}

function openHistoryFilterSheet() {
  let d = JSON.parse(JSON.stringify(UI.historyFilter));
  const toggleArr = (arr, v) => arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v];
  const draw = () => openSheet(`
    <div class="sheet-head"><strong>फ़िल्टर और क्रम (Filter & Sort)</strong><button class="icon-btn" onclick="closeSheet()">✕</button></div>
    <div class="sheet-body">
      <div class="lbl-sm">क्रम (Sort By)</div>
      <div class="row" style="flex-wrap:wrap">
        ${[['newest','नया पहले'],['oldest','पुराना पहले'],['most_time','ज़्यादा समय'],['least_time','कम समय'],['subject','विषय A–Z'],['hard','Relearn पहले']].map(([k,l]) => `<button class="pill ${d.sort===k?'active':''}" onclick="window._hf('sort','${k}')">${l}</button>`).join('')}
      </div>
      <div class="lbl-sm">समय (Time)</div>
      <div class="row" style="flex-wrap:wrap">
        ${[['none','All'],['past','Past Days'],['exact','Exact Date'],['range','Date Range']].map(([k,l]) => `<button class="pill ${d.timeMode===k?'active':''}" onclick="window._hf('timeMode','${k}')">${l}</button>`).join('')}
      </div>
      ${d.timeMode==='past'?`<div class="row">${[3,7,15,30].map(n=>`<button class="pill ${d.pastDays===n?'active':''}" onclick="window._hf('pastDays',${n})">${n}d</button>`).join('')}</div>`:''}
      ${d.timeMode==='exact'?`<input type="date" class="input" value="${d.exact}" onchange="window._hf('exact',this.value)">`:''}
      ${d.timeMode==='range'?`<div class="grid2"><input type="date" class="input" value="${d.from}" onchange="window._hf('from',this.value)"><input type="date" class="input" value="${d.to}" onchange="window._hf('to',this.value)"></div>`:''}
      <div class="lbl-sm">प्रकार (Study Mode)</div>
      <div class="row">
        <button class="pill ${d.modes.includes('Revision')?'active':''}" onclick="window._hfArr('modes','Revision')">रिवीजन</button>
        <button class="pill ${d.modes.includes('First Study')?'active':''}" onclick="window._hfArr('modes','First Study')">नया</button>
      </div>
      <div class="lbl-sm">स्थिति (Learning Status)</div>
      <div class="row">
        ${[['Hard','Relearn'],['Medium','Practice'],['Easy','Clear']].map(([k,l]) => `<button class="pill ${d.statuses.includes(k)?'active':''}" onclick="window._hfArr('statuses','${k}')">${l}</button>`).join('')}
      </div>
      <div class="lbl-sm">विषय (Subjects)</div>
      <div class="row" style="flex-wrap:wrap">
        ${Object.keys(DB.syllabus).map(s => `<button class="pill ${d.subjects.includes(s)?'active':''}" onclick="window._hfArr('subjects','${esc(s).replace(/'/g,"\\'")}')">${esc(s)}</button>`).join('')}
      </div>
    </div>
    <div class="sheet-foot">
      <button class="btn outline" style="flex:1" onclick="resetHistoryFilters();closeSheet()">Reset</button>
      <button class="btn" style="flex:1.8" onclick="window._hfApply()">Apply • ${getFilteredHistory(d, UI.historySearch).length} Results</button>
    </div>`);
  window._hf = (k, v) => { d[k] = v; draw(); };
  window._hfArr = (k, v) => { d[k] = toggleArr(d[k], v); draw(); };
  window._hfApply = () => { UI.historyFilter = d; closeSheet(); renderAll(); };
  draw();
}

// Init
renderAll();
</script>
